<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LaunchProof Job Saver</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #020617;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }
    .brand {
      font-weight: 700;
      font-size: 14px;
      color: #3b82f6;
    }
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
    }
    .label {
      font-size: 10px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }
    .val {
      font-size: 12px;
      color: #f1f5f9;
      font-weight: 600;
      margin-top: 2px;
    }
    .btn {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      margin-top: 12px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">🚀 LaunchProof</div>
  </div>

  <div class="card">
    <div class="label">Job Title</div>
    <div id="job-title" class="val">Detecting active listing...</div>

    <div class="label" style="margin-top: 8px;">Company</div>
    <div id="job-company" class="val">---</div>

    <div class="label" style="margin-top: 8px;">Location</div>
    <div id="job-location" class="val">---</div>
  </div>

  <button id="save-btn" class="btn">Save to LaunchProof</button>

  <script src="popup.js"></script>
</body>
</html>
